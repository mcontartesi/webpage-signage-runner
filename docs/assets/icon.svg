<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Base -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg-grad)" stroke="url(#accent-grad)" stroke-width="6"/>

  <!-- Screen Frame Primary -->
  <rect x="76" y="96" width="360" height="240" rx="20" fill="url(#screen-grad)" stroke="#38bdf8" stroke-width="8" filter="url(#glow)"/>
  
  <!-- Screen Glass Reflection -->
  <path d="M 80 100 L 432 100 L 360 200 L 80 200 Z" fill="white" opacity="0.04"/>

  <!-- Play / Signal / Web Symbol inside Screen -->
  <circle cx="256" cy="216" r="54" fill="url(#accent-grad)" opacity="0.9"/>
  <polygon points="244,192 284,216 244,240" fill="#ffffff"/>

  <!-- Multi-Display Indicator Cards (Backdrop Screens) -->
  <rect x="44" y="140" width="32" height="150" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="4" opacity="0.6"/>
  <rect x="436" y="140" width="32" height="150" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="4" opacity="0.6"/>

  <!-- Monitor Stand Base -->
  <path d="M 216 340 L 296 340 L 320 400 L 192 400 Z" fill="#334155"/>
  <rect x="160" y="396" width="192" height="20" rx="10" fill="#475569" stroke="#38bdf8" stroke-width="2"/>

  <!-- Signal Pulse Waves -->
  <path d="M 220 72 A 48 48 0 0 1 292 72" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <path d="M 196 52 A 80 80 0 0 1 316 52" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
</svg>
