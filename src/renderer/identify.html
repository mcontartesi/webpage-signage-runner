<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identify Display</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: transparent;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      animation: fadeIn 0.4s ease-out;
    }
    .badge-card {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(20px);
      border: 3px solid #38bdf8;
      border-radius: 28px;
      padding: 40px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 60px rgba(56, 189, 248, 0.5), 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      color: #f8fafc;
      animation: pulse 2s ease-in-out infinite;
    }
    .screen-number {
      font-size: 8rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .screen-title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .screen-meta {
      font-size: 1.2rem;
      color: #94a3b8;
      font-weight: 500;
    }
    .screen-tag {
      margin-top: 12px;
      background: rgba(56, 189, 248, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
  </style>
</head>
<body>
  <div class="badge-card">
    <div id="screen-num" class="screen-number">1</div>
    <div id="screen-title" class="screen-title">DISPLAY SCREEN 1</div>
    <div id="screen-meta" class="screen-meta">1920 × 1080</div>
    <div id="screen-tag" class="screen-tag">PRIMARY MONITOR</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const index = params.get('index') || '1';
    const id = params.get('id') || '';
    const res = params.get('res') || '1920x1080';
    const isPrimary = params.get('isPrimary') === 'true';

    document.getElementById('screen-num').textContent = index;
    document.getElementById('screen-title').textContent = `DISPLAY SCREEN ${index} (ID: ${id})`;
    document.getElementById('screen-meta').textContent = `Resolution: ${res}`;
    document.getElementById('screen-tag').textContent = isPrimary ? '★ PRIMARY DISPLAY' : 'SECONDARY DISPLAY';
  </script>
</body>
</html>
