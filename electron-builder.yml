appId: com.maximilianocontartesi.webpage-signage-runner
productName: Webpage Signage Runner
copyright: "Copyright © 2026 Maximiliano Contartesi"

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - package.json
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"

publish:
  provider: github
  owner: mcontartesi
  repo: webpage-signage-runner
  releaseType: release

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: assets/icon.svg

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Webpage Signage Runner"
  artifactName: "Webpage-Signage-Runner-Setup-${version}-${arch}.${ext}"

portable:
  artifactName: "Webpage-Signage-Runner-Portable-${version}-${arch}.${ext}"

linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
        - arm64
  category: Utility
  executableName: webpage-signage-runner
  maintainer: "Maximiliano Contartesi <maxiconta@gmail.com>"
  synopsis: "Production-grade unattended Multi-Display Digital Signage Kiosk runner"
  description: "Cross-platform multi-display kiosk runner for unattended digital signage on Windows and Linux."
  icon: assets/icon.svg
  artifactName: "${name}-${version}-${arch}.${ext}"
